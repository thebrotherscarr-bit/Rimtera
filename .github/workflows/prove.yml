name: Prove

# The provers: every push and pull request compiles the game, then runs the
# deterministic self-test suites and a repeatability check. Logs are attached
# to the run so a failure can be read without re-running it locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rimtera.csproj

      - name: Build
        run: dotnet build Rimtera.csproj -c Release --no-restore

  prove:
    name: Prove (${{ matrix.prover }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - prover: core
            command: --self-test
          - prover: batch-a-physics
            command: --batch-a-test
          - prover: headless-smoke
            command: --demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rimtera.csproj

      - name: Build
        run: dotnet build Rimtera.csproj -c Release --no-restore

      - name: Run ${{ matrix.prover }}
        shell: pwsh
        run: |
          $log = "proof-${{ matrix.prover }}.log"
          dotnet run --project Rimtera.csproj -c Release --no-build -- ${{ matrix.command }} *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          @(
            "### Prove: ${{ matrix.prover }}",
            "",
            '```',
            (Get-Content $log -Tail 12),
            '```'
          ) | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Keep the prover log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.prover }}
          path: proof-${{ matrix.prover }}.log
          retention-days: 14

  determinism:
    name: Prove (determinism)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rimtera.csproj

      - name: Build
        run: dotnet build Rimtera.csproj -c Release --no-restore

      - name: Run the demo twice and compare
        shell: pwsh
        run: |
          dotnet run --project Rimtera.csproj -c Release --no-build -- --demo *> demo-a.txt
          if ($LASTEXITCODE -ne 0) { throw "First demo run failed with exit code $LASTEXITCODE." }
          dotnet run --project Rimtera.csproj -c Release --no-build -- --demo *> demo-b.txt
          if ($LASTEXITCODE -ne 0) { throw "Second demo run failed with exit code $LASTEXITCODE." }

          $a = (Get-FileHash demo-a.txt -Algorithm SHA256).Hash
          $b = (Get-FileHash demo-b.txt -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Output "--- first run ---"
            Get-Content demo-a.txt
            Write-Output "--- second run ---"
            Get-Content demo-b.txt
            throw "The demo produced different output on identical runs ($a vs $b)."
          }

          "Deterministic demo output: $a" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-Content demo-a.txt
