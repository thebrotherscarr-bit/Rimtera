name: Prove

# The provers: every push and pull request compiles the game, then runs the
# deterministic self-test suites and a repeatability check. Logs are attached
# to the run so a failure can be read without re-running it locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Which kind of change this is. Game files (code, the project, Assets, tests, workflows) get the full proof on
  # Windows. Anything else (docs, tools, the agent setup) passes every required check on a quick Linux runner
  # without building, so small changes clear in seconds. The required check names are the same either way.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.diff.outputs.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did any game file change?
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "game=true" >> "$GITHUB_OUTPUT"
            echo "Full proof: nothing to compare against." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "$files"
          if echo "$files" | grep -Eq '(\.cs$|\.csproj$|\.props$|\.targets$|^global\.json$|^nuget\.config$|^Assets/|^tests/|^\.github/workflows/|^(Systems|World|Entities|AI|Characters|UI)/)'; then
            echo "game=true" >> "$GITHUB_OUTPUT"
            echo "Game files changed: full proof." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "game=false" >> "$GITHUB_OUTPUT"
            echo "No game files changed (docs, tools or agent setup only): the provers pass without building." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (Release)
    needs: changes
    runs-on: ${{ needs.changes.outputs.game == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.game == 'true'

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.game == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        if: needs.changes.outputs.game == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: needs.changes.outputs.game == 'true'
        run: dotnet restore Rimtera.csproj

      - name: Build
        if: needs.changes.outputs.game == 'true'
        run: dotnet build Rimtera.csproj -c Release --no-restore

  prove:
    name: Prove (${{ matrix.prover }})
    needs: [changes, build]
    runs-on: ${{ needs.changes.outputs.game == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - prover: core
            command: --self-test
          - prover: batch-a-physics
            command: --batch-a-test
          - prover: headless-smoke
            command: --demo
          # Every sprite the game asks for exists and is tracked; no frame is over 512 px.
          - prover: assets
            command: --asset-check
          # Soft performance budgets on a Small world, written to the step summary; fails only past 2x a budget.
          - prover: bench
            command: --engine-bench --only Small --budget
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.game == 'true'

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.game == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        if: needs.changes.outputs.game == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: needs.changes.outputs.game == 'true'
        run: dotnet restore Rimtera.csproj

      - name: Build
        if: needs.changes.outputs.game == 'true'
        run: dotnet build Rimtera.csproj -c Release --no-restore

      - name: Run ${{ matrix.prover }}
        if: needs.changes.outputs.game == 'true'
        shell: pwsh
        run: |
          $log = "proof-${{ matrix.prover }}.log"
          dotnet run --project Rimtera.csproj -c Release --no-build -- ${{ matrix.command }} *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          @(
            "### Prove: ${{ matrix.prover }}",
            "",
            '```',
            (Get-Content $log -Tail 12),
            '```'
          ) | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Keep the prover log
        if: always() && needs.changes.outputs.game == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.prover }}
          path: proof-${{ matrix.prover }}.log
          retention-days: 14

  determinism:
    name: Prove (determinism)
    needs: [changes, build]
    runs-on: ${{ needs.changes.outputs.game == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.game == 'true'

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.game == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        if: needs.changes.outputs.game == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        if: needs.changes.outputs.game == 'true'
        run: dotnet restore Rimtera.csproj

      - name: Build
        if: needs.changes.outputs.game == 'true'
        run: dotnet build Rimtera.csproj -c Release --no-restore

      - name: Run the demo twice and compare
        if: needs.changes.outputs.game == 'true'
        shell: pwsh
        run: |
          dotnet run --project Rimtera.csproj -c Release --no-build -- --demo *> demo-a.txt
          if ($LASTEXITCODE -ne 0) { throw "First demo run failed with exit code $LASTEXITCODE." }
          dotnet run --project Rimtera.csproj -c Release --no-build -- --demo *> demo-b.txt
          if ($LASTEXITCODE -ne 0) { throw "Second demo run failed with exit code $LASTEXITCODE." }

          $a = (Get-FileHash demo-a.txt -Algorithm SHA256).Hash
          $b = (Get-FileHash demo-b.txt -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Output "--- first run ---"
            Get-Content demo-a.txt
            Write-Output "--- second run ---"
            Get-Content demo-b.txt
            throw "The demo produced different output on identical runs ($a vs $b)."
          }

          "Deterministic demo output: $a" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-Content demo-a.txt
